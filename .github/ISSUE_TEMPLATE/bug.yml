name: Something is wrong
description: It did something it should not, or did not do what it says.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version, or the commit you used.
  - type: textarea
    id: log
    attributes:
      label: Log lines, if any
      description: Anything the program printed. Remove anything private first.
      render: text
